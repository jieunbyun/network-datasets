name: ieee118
version: 1.1.0
title: IEEE 118-bus DC optimal power flow (DC-OPF) blackout model
license: CC-BY-4.0
description: >
  IEEE 118-bus DC-OPF blackout model from Chan et al. (2024).
  The system has 118 buses, 186 branches, and 54 generators — 304 failable
  components in total. Each bus is represented as a virtual edge `vbusX`
  connecting `busX` to `busX_int`, so bus failure is modelled as edge failure.
  Component state definitions:
    - 54 generator buses (4 states): 0=complete removal (p=0.01),
      1=40% capacity (p=0.19), 2=80% capacity (p=0.30), 3=full capacity (p=0.50).
    - 64 ordinary buses (2 states): 0=failed (p=0.01), 1=operational (p=0.99).
    - 186 branches (2 states): 0=failed (p=0.01), 1=operational (p=0.99).
  Blackout threshold is 13.8% (Scenario 1 in the reference).

contacts:
  - name: Ji-Eun Byun
    email: j.byun@imperial.ac.uk
  - name: Hyeuk Ryu
    email: dynaryu@gmail.com

tags: [power, IEEE, DC-OPF, blackout, network]

files:
  nodes: data/nodes.json
  edges: data/edges.json
  probs: data/probs.json
  matpower_case: data/ieee118.m

# Attributes carried by the outer `busX` nodes of data/nodes.json. The inner
# `busX_int` nodes carry only x, y and type: transmission.
node_attributes:
  x, y: layout coordinates; no electrical meaning.
  type: >
    source        - has generation (mpc.gen); may ALSO carry demand.
    output only   - has demand and no generation.
    transmission  - neither generation nor demand.
  capacity: >
    Generation capacity in MW, summed over the bus's rows in mpc.gen (PMAX).
    Present on `source` nodes only.
  demand: >
    Nominal real power demand in MW, from the PD column of mpc.bus. Present on
    any bus with PD != 0 -- including `source` buses, 45 of the 54 of which also
    carry load (2809.0 MW, 66% of the 4242.0 MW system total).
  unit: Unit for capacity and demand; always MW.

scripts:
  - scripts/sfun_dcopt.py
  - scripts/func_dcopt_py.py
  - scripts/run_case118.py

docs:
  - docs/README.md
  - docs/PROVENANCE.md
  - docs/CHANGELOG.md

citation: |
  Chan, J., Paredes, R., Papaioannou, I., Duenas-Osorio, L., & Straub, D. (2025). Adaptive Monte Carlo methods for estimating rare events in power grids. ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems, Part A: Civil Engineering, 11(1), 04024082.
